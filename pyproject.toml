[project]
name = "Small-LLM-Creation"
version = "0.1.0"
description = "A collection of scripts for fine-tuning and training LLMs."
readme = "README.md"
requires-python = ">=3.10,<3.13"

dependencies = [
  "torch>=2.2",
  "torchvision",
  "torchaudio",
  "transformers>=4.40",
  "accelerate>=0.30",
  "datasets>=2.19",
  "peft>=0.10",
  "trl>=0.8",
  "huggingface-hub>=0.23",
  "safetensors>=0.4",
  "tokenizers>=0.19",
  "numpy>=1.26",
  "tqdm>=4.66",
  "tabulate>=0.9",
  "sentence-transformers>=2.7"
]

[tool.uv]
package = false

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"